services:
  contextual-feedback:
    build: .
    image: contextual-feedback:latest
    ports:
      - "5000:5000"
    environment:
      CONTEXTUAL_DATA_DIR: /app
      # Change this in any real deployment.
      API_KEY: terminus-dev-key
      WEB_CONCURRENCY: "2"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  # --- Observability stack (opt-in): docker compose --profile monitoring up ---
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - contextual-feedback
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  data:
  uploads:
  logs:
  prometheus_data:
  grafana_data:
